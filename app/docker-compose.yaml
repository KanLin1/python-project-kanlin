services:
  car-price-app:
    build: .
    ports:
      - "8050:8050"
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-https://mlflow.ml.brain.cs.ait.ac.th}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-student}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD}
      MODEL_NAME: ${MODEL_NAME:-st127119-a3-model}
      MODEL_STAGE: ${MODEL_STAGE:-Staging}
