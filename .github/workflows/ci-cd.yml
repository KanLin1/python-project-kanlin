name: A3 CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Run unit tests
        run: pytest -q

  deploy:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Check deployment secrets
        id: deploy_check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          if [ -n "$VM_HOST" ] && [ -n "$VM_USER" ] && [ -n "$VM_APP_DIR" ] && [ -n "$VM_SSH_KEY" ] && [ -n "$VM_KNOWN_HOSTS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are not set yet, so deployment is skipped."
          fi

      - name: Prepare SSH
        if: steps.deploy_check.outputs.ready == 'true'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy application
        if: steps.deploy_check.outputs.ready == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
        run: |
          ssh "$VM_USER@$VM_HOST" "
            set -e
            cd '$VM_APP_DIR'
            git fetch origin
            git reset --hard origin/main
            docker compose -f app/docker-compose.yaml up -d --build
          "
